# Builds the signed APK and publishes a GitHub release when a vX.Y.Z tag is pushed.
# Release by pushing a tag (git tag v0.2.5 && git push origin v0.2.5), not with `gh release create`.
# Requires four repository secrets:
#   KEYSTORE_BASE64    - the release keystore, base64-encoded (base64 -w0 multistream-release.keystore)
#   KEYSTORE_PASSWORD  - the keystore password
#   KEY_ALIAS          - the signing key alias
#   KEY_PASSWORD       - the signing key password
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; cannot build a signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > multistream-release.keystore
          cat > keystore.properties <<EOF
          storeFile=multistream-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "multistream ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest \
            app/build/outputs/apk/release/multistream.apk
